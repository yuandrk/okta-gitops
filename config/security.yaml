# The org's security baseline, managed by Terraform (modules/security).
# Admin Console: Security. Adopted as it was, then changed only through PRs; see
# docs/design.md for why it's adopt-first.

# Which authenticators exist and whether they're active. Okta never deletes an
# authenticator: listing one here adopts it, and removing it deactivates it, which
# locks out whoever is enrolled in it (the destroy guard flags that).
# Okta Verify is active too, but can't be imported (README → What's in the org).
# Google Authenticator was tried for break-glass and isn't usable here (docs/design.md).
authenticators:
  - key: okta_password
    name: Password
  - key: okta_email
    name: Email

# The default authenticator enrollment policy, per authenticator key:
# REQUIRED, OPTIONAL or NOT_ALLOWED.
enrollment:
  okta_password: REQUIRED
  okta_email: NOT_ALLOWED # Email is allowed for recovery only (its authenticator settings)

# The break-glass admin's way in: its own session policy (and, once a factor is
# chosen, its own enrollment policy), ahead of everyone else's. The user is created by
# hand and added to the group (docs/runbook.md → Break-glass admin).
break_glass:
  group: break-glass
  # factor: not chosen yet. Google Authenticator didn't work in this org.
  session_idle_minutes: 15
  session_lifetime_minutes: 60

# The global session policy for everyone else, ahead of Okta's Default Policy.
session:
  idle_minutes: 120
  lifetime_minutes: 720 # 12 h
  persistent: false
