# Okta groups managed by Terraform. Users are NOT defined here — they live in Okta
# (created via Admin Console or upstream SCIM/HRIS). Group rules use Okta Expression
# Language to auto-assign users by profile attributes.
#
# Reference: https://developer.okta.com/docs/reference/okta-expression-language/
#
# Who gets what: `terraform output inventory` (group → rule → apps / bookmarks).
groups:
  # The base group for everyone in the org, kept for future apps. Nothing is assigned
  # to it since Hermes was retired (2026-10-18).
  - name: Andriuk corp
    description: Main users
    rule: 'user.division == "IT"' # division=IT → auto-assigned

  # Gates Kite (the k3s dashboard); also the value of Kite's `groups` claim.
  - name: IT
    description: Homelab admins (Kite)
    rule: 'user.division == "IT"'

  # The break-glass admin: a second super admin for when the main account or its phone
  # is lost. No rule on purpose: membership is set by hand in the Console. Security
  # policies give this group its own path (docs/runbook.md → Break-glass admin).
  - name: break-glass
    description: Break-glass admin, membership set by hand

