# Okta app integrations managed by Terraform. Each entry produces an OIDC app, its
# sign-on policy + rule, and group assignments. Consumed by modules/apps.
#
# Headlamp is the homelab Kubernetes dashboard: users sign in through Okta (OIDC),
# the `groups` claim carries their Okta group membership, and the k3s cluster maps
# those groups to RBAC roles. The `groups` list below controls who may use the app.
apps:
  - name: Headlamp
    type: web
    grant_types: ["authorization_code", "refresh_token"]
    response_types: ["code"]
    redirect_uris: ["https://headlamp.yuandrk.net/oidc-callback"]
    post_logout_redirect_uris: ["https://headlamp.yuandrk.net"]
    refresh_token_leeway: 30
    consent_method: TRUSTED
    # CUSTOM_URL: tokens/discovery use the custom domain (okta.yuandrk.net) so the OIDC
    # flow stays on the same domain as the end-user dashboard session — enables silent SSO
    # (no re-login per app). REQUIRES the k3s/Headlamp OIDC issuer to be https://okta.yuandrk.net
    # too, or the `iss` claim won't validate. (was ORG_URL = integrator-7752059.okta.com)
    issuer_mode: CUSTOM_URL
    hide_ios: true
    hide_web: false # visible on the Okta end-user dashboard
    # IdP-initiated login enabled (set manually in Admin Console; tracked here to match live)
    login_mode: SPEC
    login_scopes: ["openid"]
    login_uri: "https://headlamp.yuandrk.net"
    groups: ["homelab-admins"] # who may sign in to Headlamp
    signon_policy:
      name: "Headlamp Sign-On Policy"
      description: "Managed by Terraform — 1FA password only"
      rule_name: "Allow password"
