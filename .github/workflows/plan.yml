name: Terraform Plan

# Runs on every PR to main (no paths: filter). `plan` is a required check, so a
# filtered-out PR (docs only) would never get it and could never merge.
# Posts a plan summary as a PR comment so reviewers can see what will change.
#
# Required GitHub repository setup (one-time):
#   Secrets : TF_VAR_API_TOKEN  — Okta API token
#   Variables: TF_VAR_ORG_NAME  — e.g. "integrator-7752059"
#              AWS_ROLE_ARN     — IAM role ARN for OIDC (see docs/design.md → CI)

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write      # required for OIDC AWS auth
  contents: read
  pull-requests: write # required to post PR comment

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Terraform fmt check
        id: fmt
        run: terraform fmt -check -recursive .
        continue-on-error: true

      - name: Terraform init
        id: init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform validate
        id: validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        id: tflint
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
        continue-on-error: true

      # Module unit tests — mock provider, no Okta calls.
      - name: Terraform test
        id: test
        run: |
          for m in modules/*/; do
            terraform -chdir="$m" init -backend=false -input=false
            terraform -chdir="$m" test -no-color
          done
        continue-on-error: true

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color
        env:
          TF_VAR_org_name: ${{ vars.TF_VAR_ORG_NAME }}
          TF_VAR_api_token: ${{ secrets.TF_VAR_API_TOKEN }}
        continue-on-error: true

      # The plan goes in through env, not ${{ }} inside the script: plan text can contain
      # `${...}` (e.g. user_name_template = "${source.login}"), which a JS template
      # literal would evaluate. That crashed this step once and is a script-injection hole.
      - name: Post plan comment
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const body = [
              `#### Fmt 🖌 \`${{ steps.fmt.outcome }}\``,
              `#### Init ⚙️ \`${{ steps.init.outcome }}\``,
              `#### Validate 🤖 \`${{ steps.validate.outcome }}\``,
              `#### TFLint 🔍 \`${{ steps.tflint.outcome }}\``,
              `#### Test 🧪 \`${{ steps.test.outcome }}\``,
              `#### Plan 📖 \`${{ steps.plan.outcome }}\``,
              `<details><summary>Show Plan</summary>\n\n\`\`\`\n${process.env.PLAN}\n\`\`\`\n</details>`,
              `*triggered by @${{ github.actor }}*`,
            ].join('\n\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if any check failed
        if: steps.fmt.outcome == 'failure' || steps.tflint.outcome == 'failure' || steps.test.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
